    <script>

        /**
         * Fetches metadata from a given URL
         * @param {string} url - The URL to fetch metadata from
         * @param {boolean} retry - Whether to retry the fetch if it fails
         * @returns {Promise<Object>} The fetched metadata
         */
         async function getMetadata(url, retry = false) {
            if (testing) console.log('Fetching metadata from:', url);
            try {
                const response = await fetch(url);
                const text = await response.text();
                try {
                    return JSON.parse(text);
                } catch {
                    // If not JSON, return text
                    return text;
                }
            } catch (error) {
                console.error('Error fetching metadata:', error);
                if (!retry) {
                    const timestamp = Math.floor(Date.now() / (60000 * 10)); // 10 minutes
                    const newUrl = `${url}?timestamp=${timestamp}`;
                    return getMetadata(newUrl, true);
                }
                throw error;
            }   
        }

        /* Loads a script dynamically
        * @param {string} url - The URL of the script to load
        * @returns {Promise} Resolves when the script is loaded
        */
        function loadScript(url) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = url;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        /**
         * Gets the content of a specific inscription
         * @param {isSat} - true if it is a satoshi
         * @param {string} id - The satoshi number or the inscriptionId 
         * @returns {Promise<Object|null>} The inscription content or null if not found
         */
         async function getInscriptionContent(id, isJson = false) {
            const url = `${baseUrl}/content/${id}`;
            if (testing) console.log('url', url);
            try {
                const response = await fetch(url);
                if (isJson) {
                    return await response.json();
                }
                return await response.text();
            } catch (error) {
                console.error(`Error fetching content for inscription ${id}:`, error);
                return null;
            }
        }

        /**
         * Retrieves inscriptions for a specific sat
         * @param {number} sat - The sat number to check
         * @param {string} backup - Backup inscription number in case the API is not working as expected
         * @param {boolean} last - Only return the last inscription on the sat, defaults to false
         * @param {Object} options - Additional options for fetching inscriptions
         * @returns {Promise<Array>} Array of inscription IDs
         */
        async function getInscriptionsForSat(sat, last = false, backup = null, skip = null) {    
            if (testing) console.log('Checking sat for inscriptions:', sat);
            if (sat === undefined) {
                console.error('Invalid sat: undefined');
                return [];
            }

            let allInscriptionIds = [];
            let totalSkipped = 0;
            let totalFetched = 0;


            if (last) {
                const url = `${baseUrl}/r/sat/${sat}/at/-1`;
                try {
                    const response = await getMetadata(url);
                    allInscriptionIds = [response];
                } catch (error) {
                    console.error(`Error fetching last inscription for sat ${sat}:`, error);
                }
            } else {
                let page = 0;
                let hasMore = true;
                while (hasMore) {
                    const url = page === 0
                        ? `${baseUrl}/r/sat/${sat}`
                        : `${baseUrl}/r/sat/${sat}/${page}`;

                    try {
                        const response = await getMetadata(url);
                        if (response && Array.isArray(response.ids)) {
                            const remainingToSkip = Math.max(skip - totalSkipped, 0);
                            const newIds = response.ids.slice(remainingToSkip);
                            totalSkipped += Math.min(remainingToSkip, response.ids.length);
                            totalFetched += newIds.length;

                            allInscriptionIds = allInscriptionIds.concat(newIds);
                            
                            hasMore = response.more;
                            if (testing) console.log(`Fetched ${newIds.length} IDs for sat ${sat} on page ${page}, total skipped: ${totalSkipped}, total fetched: ${totalFetched}`);
                            page++;
                        } else {
                            console.warn(`Unexpected response format for sat ${sat}:`, response);
                            hasMore = false;
                        }
                    } catch (error) {
                        console.error(`Error fetching inscription IDs for sat ${sat}:`, error);
                        hasMore = false;
                    }
                }
            }
            if (allInscriptionIds.length === 0 && backup && totalFetched == 0 && (!skip || skip === 0)) {
                allInscriptionIds = [backup];
            }

            return allInscriptionIds;
        }

        /**
         * Fetches inscriptions for specified oracle strings.
         * @param {string[]} oracleStrings - An array of oracle string identifiers.
         * @returns {Promise<Object>} An object containing:
         *   - scripts: Object with script names as keys and their corresponding sat numbers as values.
         *   - oracles: Array of objects, each containing sat, skip, and filter properties for oracle inscriptions.
         *   - timeTravels: Array of objects, each containing sat, skip, and filter properties for time travel inscriptions.
         */
        async function fetchInscriptions(satplication, oracleStrings) {
            let scripts = {};
            let scriptBackups = {};
            let oracles = [];
            let timeTravels = [];
            let layout = [];
            const configId = await getInscriptionsForSat(satplication, true);                         
            const content = await getInscriptionContent(configId[0].id, true);

            if (testing) console.log('content',content,'\noracleStrings',oracleStrings);
            if (content && content.protocol === 'BRC333' && content.operation === 'source') {
                for (let source of content.sources) {
                    if (testing) console.log('source',source);
                    if (source.script) {
                        if (source.src || source.sat) {
                            scripts[source.script] = source.src || source.sat;
                            if (source.backup) {
                                scriptBackups[source.script] = source.backup;
                            }
                        }
                    } else if (source.oracle && oracleStrings.includes(source.oracle)) {
                        const existingIndex = oracles.findIndex(o => o.sat === source.sat);
                        if (existingIndex !== -1) {
                            oracles[existingIndex] = { 
                                sat: source.sat, 
                                skip: source.skip,
                                filter: source.filter,
                                backup: source.backup

                            };
                        } else {
                            oracles.push({ 
                                sat: source.sat, 
                                skip: source.skip,
                                filter: source.filter,
                                backup: source.backup 
                            });
                        }
                    } else if (source.layout) {
                        if (oracleStrings.includes(source.layout))
                            layout.push({ 
                                sat: source.sat, 
                                skip: source.skip,
                                filter: source.filter,
                                backup: source.backup 
                            });
                    } else if (source.articles) {
                        if (oracleStrings.includes(source.articles))
                            articles.push({ 
                                sat: source.sat, 
                                skip: source.skip,
                                filter: source.filter,
                                backup: source.backup 
                            });
                    } else if (source.system) {
                        if (oracleStrings.includes(source.system))
                                timeTravels.push({ 
                                    sat: source.sat, 
                                    skip: source.skip,
                                    filter: source.filter,
                                    backup: source.backup 
                                });
                    } else if (source.key) {
                        if (testing) console.log('source.value', source.value);    
                        if (typeof source.value === 'string' && ( source.value.startsWith('[') || source.value.startsWith('{'))) {
                            eval(`window.${source.key} = ${source.value}`);
                        } else {
                            window[source.key] = source.value;
                        }             
                    }
                }
                if (testing) console.log('scripts', scripts);
                for (const [scriptName, scriptSrc] of Object.entries(scripts)) {
                    if (typeof scriptSrc === 'string') {
                        await loadScript(scriptSrc);
                    } else {
                        const scriptId = await getInscriptionsForSat(scriptSrc, true); 
                        const scriptUrl = `${baseUrl}/content/${scriptId[0].id}`;
                        await loadScript(scriptUrl);
                    }
                }
            }
            return { scripts, oracles, timeTravels, layout, articles };
        }

        const testing = false;
        const loadingId = "671b9b158a5fba9c85d62e6bb343688a7a4096d5c7546add0966083f79ce6799i0";

        /**

            inscriptionId = await getInscriptionId( window.location.href, "5b5566686e9909cbf7fe987c386bc213b606c07ad948ef6d4e3dbc90f5bdec6ei0");
            if (testing) console.log('inscriptionId',inscriptionId);

            const urlParams = new URLSearchParams(window.location.search);

            if (targetId) {
